<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diego is 13</title>
  <meta name="description" content="Diego Valle turns thirteen. Saturday, October 10, noon to three. Pinstripes, Hillsdale Mall.">
  <meta property="og:title" content="Diego is 13">
  <meta property="og:description" content="Saturday, October 10, noon to three. Pinstripes, Hillsdale Mall. Come celebrate.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://diegovalle.me/">
  <link rel="canonical" href="https://diegovalle.me/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Kalnia:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --stock: #d7ede3;
      --ink: #163028;
      --punch: #e21b4c;
      --flare: #ffd84a;
      --mute: #5e7d72;
      --stagger-dur: 500ms;
      --stagger-distance: 12px;
      --stagger-stagger: 40ms;
      --stagger-blur: 3px;
      --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --duration-very-slow: 500ms;
      --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
      --distance-medium: 12px;
      --blur-medium: 3px;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body {
      min-height: 100%;
      background: var(--stock);
      color: var(--ink);
    }

    body {
      font-family: Kalnia, "Times New Roman", serif;
      font-optical-sizing: auto;
      font-weight: 400;
      line-height: 1.35;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 8;
      opacity: 0.18;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.09  0 0 0 0 0.19  0 0 0 0 0.16  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .sheet {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1.25rem, 4vw, 3.5rem) clamp(1.5rem, 3vw, 2.25rem);
      gap: 0.5rem;
    }

    .mast {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .mast span:last-child {
      color: var(--mute);
    }

    .hero {
      position: relative;
      min-height: clamp(22rem, 58vh, 38rem);
      overflow: hidden;
      display: grid;
      align-content: end;
      padding-bottom: clamp(0.5rem, 2vh, 1.5rem);
    }

    h1 {
      position: absolute;
      right: 2vw;
      top: 48%;
      transform: translateY(-58%) rotate(-5deg);
      line-height: 0.72;
      user-select: none;
      pointer-events: none;
    }

    .thirteen {
      position: relative;
      display: block;
      font-family: "Big Shoulders Display", Impact, sans-serif;
      font-weight: 900;
      font-size: clamp(13rem, 46vw, 30rem);
      letter-spacing: -0.06em;
    }

    .thirteen-ghost,
    .thirteen-ink {
      display: block;
    }

    .thirteen-ghost {
      position: absolute;
      inset: 0;
      color: var(--flare);
      transform: translate(0.045em, 0.03em);
      mix-blend-mode: multiply;
    }

    .thirteen-ink {
      position: relative;
      color: var(--punch);
    }

    .lede {
      position: relative;
      z-index: 2;
      max-width: 22ch;
      padding-bottom: 0.25rem;
    }

    .lede strong {
      font-weight: 600;
      font-size: clamp(2.6rem, 7vw, 5.2rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .lede span {
      font-size: clamp(1.35rem, 2.6vw, 1.85rem);
      font-weight: 400;
      color: var(--ink);
    }

    .t-stagger-line {
      display: block;
      opacity: 0;
      transform: translateY(var(--stagger-distance));
      filter: blur(var(--stagger-blur));
      transition:
        opacity   var(--stagger-dur) var(--stagger-ease),
        transform var(--stagger-dur) var(--stagger-ease),
        filter    var(--stagger-dur) var(--stagger-ease);
      will-change: transform, opacity, filter;
    }
    .t-stagger-line--2 { transition-delay: var(--stagger-stagger); }
    .t-stagger-line--3 { transition-delay: calc(var(--stagger-stagger) * 2); }

    .t-stagger.is-shown .t-stagger-line {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
    .t-stagger.is-hiding .t-stagger-line {
      opacity: 0;
      transform: translateY(0);
      filter: blur(0);
      transition:
        opacity 200ms ease,
        transform 0s linear,
        filter 0s linear;
      transition-delay: 0s;
    }

    @media (prefers-reduced-motion: reduce) {
      .t-stagger-line { transition: none !important; }
    }

    .foot {
      display: grid;
      gap: 0.85rem;
      border-top: 2px solid var(--ink);
      padding-top: 1.1rem;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem 1.75rem;
    }

    .facts p {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 500;
      line-height: 1.2;
    }

    .facts a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }

    .facts a:hover {
      color: var(--punch);
    }

    .note {
      font-size: 1.05rem;
      color: var(--ink);
    }

    .embed {
      position: relative;
      z-index: 9;
      width: min(100%, 600px);
      margin-top: 0.4rem;
    }

    .embed iframe {
      display: block;
      width: 100%;
      height: 450px;
      border: 1px solid #bfcbda88;
      border-radius: 4px;
      background: transparent;
    }

    @media (max-width: 720px) {
      .sheet {
        padding-bottom: 2rem;
        overflow-x: hidden;
      }
      h1 {
        position: relative;
        right: auto;
        top: auto;
        justify-self: end;
        max-width: 100%;
        margin: 0.35rem -0.4rem 0 0;
        transform: rotate(-6deg);
      }
      .thirteen {
        font-size: 14.5rem;
      }
      .hero {
        min-height: 0;
        overflow: hidden;
        align-content: stretch;
      }
      .facts {
        grid-template-columns: 1fr;
        gap: 0.65rem;
      }
      .embed iframe {
        height: 40rem;
      }
    }

    @media print {
      .grain { display: none; }
      .sheet { min-height: auto; padding: 0.5in; }
      h1 { position: relative; right: 0; top: 0; transform: rotate(-5deg); }
      .t-stagger-line {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      .embed { display: none; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="sheet">
    <header class="mast">
      <span>Diego Valle</span>
      <span>2026</span>
    </header>

    <section class="hero">
      <h1 aria-label="13">
        <span class="thirteen" aria-hidden="true">
          <span class="thirteen-ghost">13</span>
          <span class="thirteen-ink">13</span>
        </span>
      </h1>
      <div class="lede t-stagger">
        <strong class="t-stagger-line t-stagger-line--1">Diego</strong>
        <span class="t-stagger-line t-stagger-line--2">turns thirteen.</span>
      </div>
    </section>

    <footer class="foot">
      <div class="facts">
        <p>Saturday, October 10</p>
        <p>Noon to three</p>
        <p>
          <a href="https://www.google.com/maps/search/?api=1&query=Pinstripes&query_place_id=ChIJbUWR7Zafj4ARMYECIC0Iey0">
            Pinstripes, Hillsdale
          </a>
        </p>
      </div>
      <p class="note">Come. Cake. Bring a story if you have one.</p>
      <div class="embed">
        <iframe
          src="https://luma.com/embed/event/evt-cC3O8iEmAqfELRD/simple"
          title="Register for Diego's 13th birthday"
          width="600"
          height="450"
          frameborder="0"
          allow="fullscreen; payment"
          aria-hidden="false"
          tabindex="0"
        ></iframe>
      </div>
    </footer>
  </main>
  <script>
    const block = document.querySelector(".t-stagger");
    function showText() {
      block.classList.remove("is-hiding");
      block.classList.remove("is-shown");
      void block.offsetHeight;
      block.classList.add("is-shown");
    }
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      block.classList.add("is-shown");
    } else {
      requestAnimationFrame(showText);
    }
  </script>
</body>
</html>
